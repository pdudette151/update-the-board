 <div class="task-form-overlay" (click)="onCancel()">
    <div class="task-form" (click)="$event.stopPropagation()">
        <h2>{{ editTask ? 'Edit Task' : 'Create New Task' }}</h2>

        <form (ngSubmit)="onSubmit()">
          <div class="form-group">
            <label for="title">Title *</label>
            <input
              type="text"
              id="title"
              [(ngModel)]="title"
              name="title"
              required
              placeholder="Enter task title">
          </div>

          <div class="form-group">
            <label for="description">Description</label>
            <textarea
              id="description"
              [(ngModel)]="description"
              name="description"
              rows="3"
              placeholder="Enter task description"></textarea>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="status">Status</label>
              <select id="status" [(ngModel)]="status" name="status">
                <option value="todo">To Do</option>
                <option value="in_progress">In Progress</option>
                <option value="done">Done</option>
                <option value="blocked">Blocked</option>
              </select>
            </div>

            <div class="form-group">
              <label for="priority">Priority</label>
              <select id="priority" [(ngModel)]="priority" name="priority">
                <option value="low">Low</option>
                <option value="medium">Medium</option>
                <option value="high">High</option>
              </select>
            </div>
          </div>

          <div class="form-group">
            <label for="assigned_to">Assigned To</label>
            <select id="assigned_to" [(ngModel)]="assignedTo" name="assigned_to">
              <option value="">Unassigned</option>
              @for (u of users; track u.uid) {
                <option [value]="u.email">{{ u.displayName ? u.displayName + ' - ' + u.email : u.email }}</option>
              }
            </select>
          </div>

          <div class="form-actions">
            <button type="button" class="btn btn-secondary" (click)="onCancel()">Cancel</button>
            <button type="submit" class="btn btn-primary" [disabled]="!title()">{{ editTask ? 'Save Changes' : 'Create Task' }}</button>
          </div>
          
        </form>
    </div>
</div>
